name: Collect weather and build
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: weather-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculations
        run: npm test
      - name: Fetch and archive forecasts
        id: scan
        continue-on-error: true
        run: npm run collect
      - name: Save scan history
        if: steps.scan.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/latest.json public/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive regional forecast scan [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: Build site
        run: npm run build
      - name: Upload deployable site
        uses: actions/upload-artifact@v4
        with:
          name: tempwether-site
          path: dist
      - name: Report collection failure
        if: steps.scan.outcome != 'success'
        run: |
          echo 'Weather collection failed. Existing data was preserved; the browser can retry live data.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
